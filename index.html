<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MTG Commander Tracker</title>
<!-- PWA: installable to the home screen, runs fullscreen + offline -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f1115" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Tracker" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<style>
  :root {
    --bg: #0f1115; --surface: #171a21; --surface-2: #1f242e;
    --line: #2a313d; --text: #e6e9ef; --muted: #8b93a3;
    --accent: #c9a24b;          /* gold */
    --good: #4caf82; --bad: #e0635a; --warn: #d8a93a;
    --r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: calc(72px + env(safe-area-inset-bottom));
    max-width: 540px; margin: 0 auto; min-height: 100vh;
  }
  h1, h2, h3 { margin: 0; font-weight: 650; }
  .app-header {
    padding: 18px 18px 10px; display: flex; align-items: baseline; gap: 8px;
  }
  .app-header h1 { font-size: 19px; letter-spacing: .2px; }
  .app-header .tag { color: var(--accent); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .view { display: none; padding: 6px 16px 24px; }
  .view.active { display: block; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 14px; }
  .tile .label { color: var(--muted); font-size: 11.5px; text-transform: uppercase; letter-spacing: .6px; }
  .tile .value { font-size: 26px; font-weight: 680; margin-top: 3px; }
  .tile .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .tile.hero { grid-column: 1 / -1; background: linear-gradient(135deg, #1d2330, #171a21); position: relative; }
  .tile.hero .value { font-size: 34px; }
  /* "what does this score mean?" popover, top-right of the hero tile */
  .hero-info { position: absolute; top: 10px; right: 12px; }
  .hero-info summary { list-style: none; cursor: pointer; width: 20px; height: 20px; border-radius: 50%;
    border: 1px solid var(--line); color: var(--muted); font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; }
  .hero-info summary::-webkit-details-marker { display: none; }
  .hero-info[open] summary { color: var(--text); border-color: var(--muted); }
  .info-pop { position: absolute; right: 0; top: 26px; width: min(250px, 78vw);
    background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 12.5px; line-height: 1.45; color: var(--text);
    box-shadow: 0 8px 22px rgba(0,0,0,.45); z-index: 5; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  /* sparkline + hover/hold chip */
  .spark-wrap { position: relative; touch-action: none; }
  .spark-wrap svg { display: block; }
  .spark-dot { position: absolute; width: 6px; height: 6px; border-radius: 50%;
    transform: translate(-50%, -50%); box-shadow: 0 0 0 1.5px var(--bg); cursor: pointer; }
  .spark-dot.end { width: 8px; height: 8px; }
  .spark-dot::before { content: ""; position: absolute; inset: -8px; }  /* fat tap target */
  /* soft dotted "0 = matching the pod" baseline (HTML so it stays crisp under the SVG stretch) */
  .spark-zero { position: absolute; left: 0; right: 0; border-top: 1.5px dotted var(--muted);
    opacity: .45; pointer-events: none; }
  .spark-chip { position: absolute; bottom: 100%; margin-bottom: 4px; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--line); color: var(--text);
    font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 7px; white-space: nowrap;
    pointer-events: none; opacity: 0; transition: opacity .12s; z-index: 2; }
  .spark-chip.show { opacity: 1; }

  .section-head { display:flex; align-items:center; justify-content:space-between; margin: 18px 2px 9px; }
  .section-head h2 { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; }

  /* segmented control */
  .seg { display:inline-flex; background: var(--surface-2); border:1px solid var(--line); border-radius: 10px; padding: 2px; }
  .seg button { border:0; background:transparent; color:var(--muted); font-size:12.5px; font-weight:600; padding:5px 11px; border-radius:8px; cursor:pointer; }
  .seg button.on { background: var(--accent); color:#1a1206; }

  /* leaderboard */
  .lb { background: var(--surface); border:1px solid var(--line); border-radius: var(--r); overflow:hidden; }
  .lb-row { display:grid; grid-template-columns: 22px 1fr auto; gap:10px; align-items:center; padding: 12px 14px; border-top:1px solid var(--line); cursor:pointer; }
  .lb-row:first-child { border-top:0; }
  .lb-row .rank { color: var(--muted); font-weight:700; font-size:13px; text-align:center; }
  .lb-row .name { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-row .theme { color: var(--muted); font-size:12px; margin-top:1px; }
  .theme-txt { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-row .metric { text-align:right; font-weight:700; font-size:15px; white-space:nowrap; }
  .lb-row .metric small { display:block; color:var(--muted); font-weight:500; font-size:11px; }
  .lb-row.low { opacity:.5; }
  .flag { font-size:11px; color:var(--warn); margin-left:6px; }

  /* leaders strip */
  .leaders { display:flex; gap:9px; overflow-x:auto; padding:1px 1px 4px; -webkit-overflow-scrolling:touch; }
  .leaders::-webkit-scrollbar { display:none; }
  .leader { flex:0 0 auto; min-width:108px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .leaders .leader { max-width:170px; }
  .leader .lt { font-size:11px; color:var(--muted); white-space:nowrap; }
  .leader .ln { font-size:14px; font-weight:650; margin-top:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .leader .lv { font-size:13px; color:var(--accent); font-weight:700; }
  .leader .lv.pos { color:var(--good); } .leader .lv.neg { color:var(--bad); }
  .leader .lr { display:flex; justify-content:space-between; align-items:baseline; margin-top:1px; }
  .leader .lp { font-size:11px; color:var(--muted); }
  .leader[data-deck] { cursor:pointer; }

  /* stacked metric sections + ranked bar list */
  .cmp-metric { margin-bottom:22px; }
  .cmp-h { margin-bottom:11px; }
  .cmp-h h3 { font-size:15px; }
  .rank-list { display:flex; flex-direction:column; gap:9px; }
  .rank-row { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px 13px; cursor:pointer; }
  .rank-row.low { opacity:.6; }
  .rank-head { display:flex; align-items:baseline; gap:9px; margin-bottom:9px; }
  .rank-head .rk { color:var(--muted); font-weight:700; font-size:13px; width:14px; }
  .rank-head .rk-name { flex:1; font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rank-head .rk-val { font-weight:700; font-size:15px; font-variant-numeric:tabular-nums; }
  .rk-val.best { color:var(--accent); } .rk-val.pos { color:var(--good); } .rk-val.neg { color:var(--bad); }
  .bar-track { position:relative; height:9px; background:var(--surface-2); border-radius:5px; overflow:hidden; }
  .bar-fill { position:absolute; top:0; bottom:0; border-radius:5px; }
  .bar-track.diverge .bar-axis { position:absolute; left:50%; top:-1px; bottom:-1px; width:1px; background:var(--muted); opacity:.5; }

  /* form */
  .field { margin-bottom: 15px; }
  .field > label { display:block; color: var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.6px; margin-bottom:7px; }
  select, input[type=text], input[type=date], input[type=password], textarea {
    width:100%; background: var(--surface); color: var(--text); border:1px solid var(--line);
    border-radius:11px; padding:13px 13px; font-size:16px; -webkit-appearance:none; appearance:none;
  }
  textarea { resize:vertical; min-height:64px; font-size:15px; }
  .choices { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { flex:1; min-width:54px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px 0; font-size:16px; font-weight:600; cursor:pointer; }
  .chip.on { background: var(--accent); color:#1a1206; border-color: var(--accent); }
  .placement-grid { display:grid; grid-template-columns: repeat(5,1fr); gap:8px; }
  .opp-block { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 12px; margin-bottom:9px; }
  .opp-row { display:flex; gap:8px; align-items:center; margin-bottom:9px; }
  .opp-row:last-child { margin-bottom:0; }
  .part-body .opp-row { margin-bottom:0; }   /* part-body gap handles the spacing now */
  .opp-row input { flex:1; }
  .opp-row .opp-player { flex:1 1 auto; width:auto; }
  .opp-row .opp-place { flex:0 0 120px; width:120px; }
  .opp-block .opp-picker { /* picker sits directly under the player/place row */ }
  .btn-primary { width:100%; background: var(--accent); color:#1a1206; border:0; border-radius:12px; padding:15px; font-size:16px; font-weight:700; cursor:pointer; margin-top:6px; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }

  /* deck detail */
  .back { background:none; border:0; color:var(--accent); font-size:14px; font-weight:600; padding:6px 0; cursor:pointer; }
  .chart-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px; margin-bottom:14px; }
  .chart-card h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:12px; }
  .dist { display:flex; align-items:flex-end; gap:8px; height:110px; }
  .dist .bar { flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:6px; height:100%; }
  .dist .bar .fill { width:100%; background:linear-gradient(180deg,var(--accent),#8a6f2f); border-radius:6px 6px 0 0; min-height:3px; }
  .dist .bar .n { font-size:12px; color:var(--muted); }
  .dist .bar .lab { font-size:11px; color:var(--muted); }
  .game-item { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px; }
  .game-item .top { display:flex; justify-content:space-between; align-items:center; }
  .game-item .badge { font-size:12px; font-weight:700; padding:2px 9px; border-radius:20px; }
  .game-item .note { color:var(--muted); font-size:12.5px; margin-top:5px; }
  .empty { color:var(--muted); text-align:center; padding:40px 10px; }

  /* bottom nav */
  nav.tabbar {
    position: fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:540px;
    display:grid; grid-auto-flow:column; grid-auto-columns:1fr; background: rgba(20,23,30,.96);
    border-top:1px solid var(--line); padding: 8px 0 calc(8px + env(safe-area-inset-bottom)); backdrop-filter: blur(8px);
  }
  nav.tabbar button { background:none; border:0; color:var(--muted); font-size:10.5px; font-weight:600; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px; padding:0; white-space:nowrap; }
  nav.tabbar button .ico { font-size:19px; line-height:1; }
  nav.tabbar button.on { color: var(--accent); }
  .sync-btn { margin-left:auto; background:var(--surface-2); border:1px solid var(--line); color:var(--muted); font-size:16px; width:34px; height:34px; border-radius:9px; cursor:pointer; }
  .sync-btn.dirty { color:var(--warn); border-color:var(--warn); }
  .sync-btn.syncing { color:var(--accent); animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .set-card code { background:var(--surface-2); padding:1px 6px; border-radius:5px; font-size:12px; }

  /* head-to-head / rivals */
  .h2h { display:flex; align-items:stretch; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:10px; }
  .h2h[data-rival] { cursor:pointer; }
  .h2h-body { flex:1; min-width:0; }
  .h2h .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
  .h2h .who { font-weight:650; font-size:16px; }
  .h2h .rec { font-size:13px; color:var(--muted); }
  .h2h .wld { display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:10px; background:var(--surface-2); }
  .h2h .wld span { display:block; }
  .h2h .legend { display:flex; flex-wrap:wrap; column-gap:12px; row-gap:3px; margin-top:7px; font-size:11.5px; color:var(--muted); }
  .h2h .legend i { font-style:normal; white-space:nowrap; }  /* wrap between entries, never inside one */
  .dot { display:inline-block; width:8px; height:8px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  /* settings */
  .set-card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:15px; margin-bottom:14px; }
  .set-card h3 { font-size:14px; margin-bottom:6px; }
  .set-card p { color:var(--muted); font-size:12.5px; margin:0 0 12px; line-height:1.45; }
  .btn-ghost { width:100%; background:var(--surface-2); color:var(--text); border:1px solid var(--line); border-radius:11px; padding:13px; font-size:15px; font-weight:600; cursor:pointer; margin-top:8px; }
  .row-actions { display:flex; gap:8px; }
  .row-actions .btn-ghost { margin-top:0; }
  .toast { position:fixed; left:50%; bottom:84px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--line); color:var(--text); padding:10px 16px; border-radius:10px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:50; }
  .toast.show { opacity:1; }

  /* live game */
  .live-head { display:flex; align-items:center; justify-content:space-between; margin:6px 0 2px; }
  .live-head h2 { font-size:18px; }
  .part-list { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  .part-row { display:flex; align-items:stretch; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:9px 10px; }
  .part-row.me { border-color:var(--accent); }
  /* big square commander art on the left of the row; fixed width, vertically centred. Each art is
     forced square via aspect-ratio; a partner deck stacks two squares (frame grows taller). */
  .part-art { flex:0 0 auto; width:74px; align-self:center; }
  .h2h-art  { flex:0 0 auto; width:88px; align-self:center; }
  .ci-frame.rowfill { display:flex; flex-direction:column; gap:7px; width:100%; padding:3px; border-radius:14px; }
  .ci-frame.rowfill.noring { padding:0; }
  .ci-frame.rowfill > .rowfill { width:100%; aspect-ratio:1; border-radius:10px; object-fit:cover; object-position:50% 22%; display:block; }
  .ci-frame.rowfill.noring > .rowfill { border-radius:11px; }
  .rowfill.ph { background:var(--surface-2); }
  .part-body { flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; justify-content:center; }
  .part-name { font-weight:600; font-size:14.5px; }
  .part-name .lead { color:var(--muted); font-weight:700; margin-right:6px; }
  .part-static { font-size:14px; }
  .part-deck { width:100%; }
  .part-drag, .part-rm, .part-rm-spacer, .ed-nums { align-self:center; }
  .part-rm { background:none; border:0; color:var(--bad); font-size:16px; cursor:pointer; padding:4px; width:24px; }
  .part-rm-spacer { display:inline-block; width:24px; flex:0 0 24px; }
  .add-players { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip-add { background:var(--surface-2); border:1px dashed var(--line); color:var(--text); font-size:14px; font-weight:600; padding:9px 14px; border-radius:11px; cursor:pointer; }
  /* colour identity pips */
  .pips-ci { display:inline-flex; gap:2px; vertical-align:middle; }
  .ci { width:13px; height:13px; border-radius:50%; border:1px solid rgba(0,0,0,.4); display:inline-block; box-shadow:0 0 0 .5px rgba(255,255,255,.12); }
  .ci.W{background:#f6f0da} .ci.U{background:#2f7dc0} .ci.B{background:#414048} .ci.R{background:#d0473e} .ci.G{background:#3f9d5c} .ci.C{background:#9aa0a8}

  /* commander art */
  .art { width:42px; height:42px; border-radius:9px; object-fit:cover; object-position:50% 28%; flex:0 0 auto; background:var(--surface-2); }
  .art-sm { width:30px; height:30px; border-radius:7px; }
  .lb-row .art, .deck-row .art { margin-right:2px; }
  .art-slot:empty, .art-slot2:empty { display:none; }
  .deck-hero-art { width:100%; height:120px; object-fit:cover; object-position:50% 28%; border-radius:var(--r); margin:8px 0 4px; }
  /* colour-identity ring (frames the art instead of inline pips) — inner art shrinks so the
     framed footprint stays ~equal to the bare art and rows keep aligning. */
  .ci-frame { display:inline-flex; flex:0 0 auto; padding:2.5px; border-radius:11px; line-height:0; }
  .lb-row .ci-frame { margin-right:2px; }
  .ci-frame > .art { margin:0; }   /* don't shrink the art — the ring just adds size outside */
  /* art beside a form field (log / edit / live): fixed size, kept just under the input box height */
  .ci-frame.field { padding:3px; border-radius:12px; }
  .ci-frame.field > .art { width:40px; height:40px; border-radius:9px; }
  .art.field { width:40px; height:40px; border-radius:10px; }
  .ci-frame.banner { display:block; padding:2.5px; border-radius:calc(var(--r) + 2px); margin:8px 0 4px; }
  .ci-frame.banner > .deck-hero-art { margin:0; display:block; }
  /* art focal-point tuner (deck editor) */
  .art-tune { margin:4px 0 2px; }
  .tune-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; margin-bottom:7px; }
  .tune-preview { width:100%; height:110px; object-fit:cover; border-radius:10px; display:block; background:var(--surface-2); }
  .tune-range { width:100%; margin-top:9px; accent-color:var(--accent); }
  /* recently-played: 3 equal columns so right edges align */
  .recent-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; }
  .recent-grid .leader { min-width:0; }
  .recent-grid .leader .recent-art { width:100%; height:54px; border-radius:8px; object-fit:cover; object-position:50% 28%; margin-bottom:7px; }

  /* autocomplete */
  .ac-wrap { position:relative; }
  .ac-list { position:absolute; left:0; right:0; top:calc(100% + 4px); background:var(--surface-2); border:1px solid var(--line); border-radius:11px; z-index:30; max-height:230px; overflow-y:auto; box-shadow:0 8px 24px rgba(0,0,0,.4); }
  .ac-item { display:flex; align-items:center; gap:9px; padding:9px 11px; cursor:pointer; border-bottom:1px solid var(--line); font-size:14px; }
  .ac-item:last-child { border-bottom:0; }
  .ac-item:hover, .ac-item.active { background:var(--surface); }
  .ac-item .art-sm { width:26px; height:26px; }
  .ac-empty { padding:10px 11px; color:var(--muted); font-size:13px; }
  .second-pick { margin-top:8px; padding-top:9px; border-top:1px dashed var(--line); }
  .second-label { font-size:11px; color:var(--accent); text-transform:uppercase; letter-spacing:.5px; margin-bottom:6px; }

  /* deck manager */
  .deck-list { display:flex; flex-direction:column; gap:8px; }
  .deck-row { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:11px 13px; }
  .deck-info { flex:1; min-width:0; }
  .deck-info .name { font-weight:600; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .deck-info .theme { color:var(--muted); font-size:12px; margin-top:2px; }
  .deck-acts { display:flex; gap:6px; }
  .icon-btn { background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:34px; height:34px; border-radius:9px; font-size:14px; cursor:pointer; }
  .icon-btn:disabled { opacity:.35; cursor:default; }
  .deck-edit { background:var(--surface); border:1px solid var(--accent); border-radius:12px; padding:12px; display:flex; flex-direction:column; gap:9px; }

  .part-drag { touch-action:none; cursor:grab; color:var(--muted); font-size:20px; padding:4px 6px; user-select:none; }
  .part-row.dragging { opacity:.85; border-color:var(--accent); background:var(--surface-2); }
  /* tie groups on the finishing-order screen (drag one row onto another to combine) */
  .part-row.tie-target { border-color:var(--warn); box-shadow:0 0 0 1.5px var(--warn); }
  .part-row.tied { border-color:var(--warn); }
  .part-row.tied-cont { margin-top:-6px; border-top-left-radius:0; border-top-right-radius:0; border-top-style:dashed; }
  .part-row.tied:has(+ .tied-cont) { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  .game-item.tap { cursor:pointer; }
  .ed-nums { display:flex; flex-direction:column; gap:6px; }
  .ed-nums label { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .ed-nums .lbl { display:inline-block; width:34px; text-align:right; text-transform:uppercase; letter-spacing:.4px; }
